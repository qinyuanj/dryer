name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # crapper_link imports crapper from the ../crapper sibling directory.
      - uses: actions/checkout@v4
        with:
          path: dryer
      - uses: actions/checkout@v4
        with:
          repository: qinyuanj/crapper
          path: crapper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: dryer
      # The grammars are downloaded here, on a cold runner, so the suite always
      # exercises the download path instead of a warm cache.
      - name: Download the tree-sitter grammars
        working-directory: dryer
        run: >
          python -c "from dryer.treesitter import parse;
          [parse('x', grammar) for grammar in
          ('java', 'go', 'python', 'typescript', 'tsx', 'rust', 'lua')]"
      - run: python -m pytest -q -rs
        working-directory: dryer
